<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Sports Schedule</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:18px 16px 48px}.hero{background:#111827;color:#fff;border-radius:22px;padding:22px;margin-bottom:14px}.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;color:#d1d5db}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0000000d}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:145px}button,.btn,input{font:inherit;border-radius:12px;padding:12px 14px}.btn,button{border:0;background:#111827;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;text-align:center}.secondary{background:#e5e7eb;color:#111827}.danger{background:#b91c1c}input{width:100%;border:1px solid #d1d5db;margin:5px 0 10px;background:#fff}.game{border-top:1px solid #e5e7eb;padding:15px 0}.game:first-child{border-top:0}.game h3{margin:0 0 5px}.muted{color:#6b7280}.hidden{display:none!important}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e5e7eb;font-size:12px;font-weight:700}.adminBadge{background:#dcfce7;color:#166534}.msg{font-weight:600;margin-top:8px}.small{font-size:13px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}.modalBox{background:#fff;border-radius:20px;padding:20px;width:min(100%,480px)}.modal h2{margin-top:0}.close{float:right;background:#e5e7eb;color:#111827;padding:7px 10px}.adminTools{margin-top:10px}.footer{text-align:center;color:#6b7280;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><h1>🏆 Sports Schedule</h1><p>One schedule. One permanent link. Everyone stays updated.</p></div>
  <div id="teamCard" class="card">
    <span id="modeBadge" class="badge">Viewer</span>
    <h2 id="teamName">Loading schedule…</h2><div id="sport" class="muted"></div>
    <div class="row" style="margin-top:14px">
      <button id="shareBtn">Share Viewer Link</button>
      <button id="calendarBtn" class="secondary">📅 Subscribe to Calendar</button>
    </div>
    <div id="adminTools" class="adminTools hidden"><button id="addBtn">＋ Add Game</button></div>
    <div style="margin-top:10px"><button id="recoverBtn" class="secondary">🔐 Recover Admin Access</button></div>
  </div>
  <div class="card"><h2>Schedule</h2><div id="games"><p class="muted">Loading games…</p></div></div>
  <div class="footer">Schedule refreshes automatically every 30 seconds.</div>
</div>
<div id="recoverModal" class="modal hidden"><div class="modalBox"><button class="close" data-close="recoverModal">✕</button><h2>Recover Admin Access</h2><p class="muted">Enter the private recovery code. A new admin key and recovery code will be created.</p><input id="recoveryCode" placeholder="Recovery code" autocomplete="off"><button id="doRecover">Recover Admin Mode</button><div id="recoverMsg" class="msg"></div></div></div>
<div id="gameModal" class="modal hidden"><div class="modalBox"><button class="close" data-close="gameModal">✕</button><h2 id="gameTitle">Add Game</h2><input id="opponent" placeholder="Opponent / event"><div class="row"><input id="eventDate" type="date"><input id="startTime" type="time"></div><div class="row"><input id="duration" type="number" value="120" min="15" max="720" placeholder="Minutes"><input id="location" placeholder="Location"></div><input id="notes" placeholder="Notes"><button id="saveGame">Save Game</button><div id="gameMsg" class="msg"></div></div></div>
<script>
const API='https://rdtmwkamjxokoobfdyir.supabase.co/functions/v1/schedule-api';
const DEFAULT_SLUG='cardinal-charter-academy-5c6ec6';
const qs=new URLSearchParams(location.search);const slug=qs.get('team')||DEFAULT_SLUG;
let adminKey=location.hash.startsWith('#admin=')?decodeURIComponent(location.hash.slice(7)):'';let team=null,games=[],editing=null;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,slug,...payload})});const x=await r.json();if(!r.ok)throw new Error(x.error||'Request failed');return x}
async function load(){try{const r=await fetch(`${API}?action=get&slug=${encodeURIComponent(slug)}`);const x=await r.json();if(!r.ok)throw new Error(x.error||'Unable to load schedule');team=x.team;games=x.games||[];render()}catch(e){$('games').innerHTML=`<p>${esc(e.message)}</p>`}}
function fmtDate(d){return new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}function fmtTime(t){const [h,m]=t.split(':');return new Date(2000,0,1,+h,+m).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}
function render(){ $('teamName').textContent=team.name;$('sport').textContent=team.sport||'';$('modeBadge').textContent=adminKey?'Administrator':'Viewer';$('modeBadge').className='badge '+(adminKey?'adminBadge':'');$('adminTools').classList.toggle('hidden',!adminKey);$('recoverBtn').classList.toggle('hidden',!!adminKey);$('games').innerHTML=games.length?games.map(g=>`<div class="game"><h3>${esc(g.opponent)}</h3><div><strong>${fmtDate(g.event_date)} · ${fmtTime(g.start_time)}</strong></div>${g.location?`<div class="muted">📍 ${esc(g.location)}</div>`:''}${g.notes?`<div class="muted">${esc(g.notes)}</div>`:''}${adminKey?`<div class="row" style="margin-top:10px"><button class="secondary" onclick="editGame('${g.id}')">Edit</button><button class="danger" onclick="deleteGame('${g.id}')">Delete</button></div>`:''}</div>`).join(''):'<p class="muted">No games scheduled.</p>'}
$('shareBtn').onclick=async()=>{const u=`${location.origin}${location.pathname}?team=${encodeURIComponent(slug)}`;try{if(navigator.share)await navigator.share({title:team?.name||'Sports Schedule',url:u});else{await navigator.clipboard.writeText(u);alert('Viewer link copied.')}}catch{}};
$('calendarBtn').onclick=()=>{const u=`rdtmwkamjxokoobfdyir.supabase.co/functions/v1/schedule-api?action=calendar&slug=${encodeURIComponent(slug)}`;location.href='webcal://'+u};
$('recoverBtn').onclick=()=>{$('recoverModal').classList.remove('hidden');$('recoverMsg').textContent='';$('recoveryCode').value=''};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).classList.add('hidden'));
$('doRecover').onclick=async()=>{const code=$('recoveryCode').value.trim();if(!code)return $('recoverMsg').textContent='Enter your recovery code.';try{$('recoverMsg').textContent='Checking…';const x=await api('recover',{recoveryCode:code});adminKey=x.adminKey;localStorage.setItem('recovery-'+slug,x.recoveryCode);history.replaceState(null,'',`${location.pathname}?team=${encodeURIComponent(slug)}#admin=${encodeURIComponent(adminKey)}`);$('recoverModal').classList.add('hidden');render();alert('Admin access restored. Your NEW recovery code is: '+x.recoveryCode+'\n\nSave this code somewhere private. Your old recovery code no longer works.')}catch(e){$('recoverMsg').textContent=e.message}};
$('addBtn').onclick=()=>openGame();function openGame(g=null){editing=g;$('gameTitle').textContent=g?'Edit Game':'Add Game';$('opponent').value=g?.opponent||'';$('eventDate').value=g?.event_date||'';$('startTime').value=(g?.start_time||'').slice(0,5);$('duration').value=g?.duration_minutes||120;$('location').value=g?.location||'';$('notes').value=g?.notes||'';$('gameMsg').textContent='';$('gameModal').classList.remove('hidden')}
window.editGame=id=>openGame(games.find(g=>g.id===id));window.deleteGame=async id=>{if(!confirm('Delete this game?'))return;try{await api('delete',{adminKey,gameId:id});await load()}catch(e){alert(e.message)}};
$('saveGame').onclick=async()=>{const game={id:editing?.id,opponent:$('opponent').value.trim(),event_date:$('eventDate').value,start_time:$('startTime').value,duration_minutes:+$('duration').value||120,location:$('location').value.trim(),notes:$('notes').value.trim(),sport:team?.sport||''};if(!game.opponent||!game.event_date||!game.start_time)return $('gameMsg').textContent='Opponent, date, and time are required.';try{$('gameMsg').textContent='Saving…';await api(editing?'update':'add',{adminKey,game});$('gameModal').classList.add('hidden');await load()}catch(e){$('gameMsg').textContent=e.message}};
load();setInterval(load,30000);
</script>
</body></html>
